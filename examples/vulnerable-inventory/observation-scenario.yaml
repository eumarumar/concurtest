# Check observed stock after concurrent purchases.
# Run instructions and expected results: README.md.
version: 1
name: inventory oversell
target: http://127.0.0.1:8080
request_timeout: 2s

setup:
  method: POST
  path: /reset

precondition:
  request:
    method: GET
    path: /state
  assert:
    name: stock must start at one
    json_integer_path: [stock]
    equals: 1

operation:
  name: purchase
  method: POST
  path: /purchase

execution:
  attempts: 4
  concurrency: 4
  trials: 10
  reduce: true

observation:
  method: GET
  path: /state

outcomes:
  rejected_status_codes: [409]

invariant:
  name: final stock must be non-negative
  json_integer_path: [stock]
  minimum: 0
