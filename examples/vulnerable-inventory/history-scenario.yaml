version: 1
name: inventory accepted purchases
target: http://127.0.0.1:8080
request_timeout: 2s

setup:
  method: POST
  path: /reset

operation:
  name: purchase
  method: POST
  path: /purchase

execution:
  attempts: 4
  concurrency: 4
  trials: 10
  reduce: true

observation:
  method: GET
  path: /available-stock

invariant:
  name: accepted purchases must not exceed stock
  maximum_successful_attempts: 1
  successful_status_codes: [201]
