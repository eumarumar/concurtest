# Count accepted purchases even when reported availability hides overselling.
# Run instructions and expected results: README.md.
version: 1
name: inventory accepted purchases
target: http://127.0.0.1:8080
request_timeout: 2s

setup:
  method: POST
  path: /reset

precondition:
  request:
    method: GET
    path: /state
  assert:
    name: stock must start at one
    json_integer_path: [stock]
    equals: 1

operation:
  name: purchase
  method: POST
  path: /purchase

execution:
  attempts: 4
  concurrency: 4
  trials: 10
  reduce: true

outcomes:
  rejected_status_codes: [409]

invariant:
  name: accepted purchases must not exceed stock
  maximum_successful_attempts: 1
  successful_status_codes: [201]
